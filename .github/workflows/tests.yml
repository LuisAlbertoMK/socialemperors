name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check .
      - run: pytest -q

  windows:
    # The shipped artifact is a Windows executable (PyInstaller), so the suite
    # must pass on Windows too: path separators, os.replace semantics and the
    # frozen-path logic in bundle.py are only exercised here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff pytest
      - run: pytest -q
