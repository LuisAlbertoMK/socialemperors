{% extends "base.html" %}
{% block head %}        <!-- Served from assets/ruffle/ so the Ruffle path also works offline; the CDN
             is only a fallback for when the bundled copy is missing. See
             assets/ruffle/README.md for the version and hashes. -->
        <script src="http://{{SERVERIP}}:{{SERVERPORT}}/default01.static.socialpointgames.com/static/socialempires/ruffle/ruffle.js"
                onerror="this.onerror=null;this.src='https://unpkg.com/@ruffle-rs/ruffle/ruffle.js';"></script>
        <!--<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js"></script>-->
{% endblock %}
{% block game %}        <!-- EMBED GAME -->
        <object>
            <div id='ruffle'></div>
            <div id='ruffle-status' style='width:760px;font-size:10pt;color:#333'></div>
            <script>
                function ruffleStatus(message, isError) {
                    var el = document.getElementById("ruffle-status");
                    el.textContent = message;
                    if (isError) { el.style.color = "red"; el.style.fontWeight = "bold"; }
                }
                // No-pause mod: keep the game logic running when the tab loses
                // focus. Ruffle pauses on hidden tabs with
                // backgroundExecutionMode "none"; "mainThread" keeps it alive
                // at the cost of some background CPU. Set both the global
                // default and the per-player option so an older bundled
                // ruffle.js that ignores one still honors the other.
                window.RufflePlayer = window.RufflePlayer || {};
                window.RufflePlayer.config = Object.assign(
                    {}, window.RufflePlayer.config || {},
                    { backgroundExecutionMode: "mainThread", autoplay: true }
                );
                try {
                    var ruffleVersion = (window.RufflePlayer.newest && window.RufflePlayer.newest().version) || "unknown";
                    ruffleStatus("Ruffle " + ruffleVersion + " loading {{GAMEVERSION}} ...");
                } catch (error) {
                    ruffleStatus("Ruffle failed to start (ruffle.js did not load, local copy and CDN both failed): " + error, true);
                    throw error;
                }
                var ruffle = window.RufflePlayer.newest(),
                player = Object.assign(document.getElementById("ruffle").appendChild(ruffle.createPlayer()), {
                    width: 760,
                    height: 600,
                    style: 'width: 760px; height: 600px; background-color: #669C2C;',
                });
                player.load({ // https://ruffle.rs/js-docs/master/interfaces/URLLoadOptions.html
                    url: "http://{{SERVERIP}}:{{SERVERPORT}}/default01.static.socialpointgames.com/static/socialempires/flash/SELoader.swf?swftoload=http://{{SERVERIP}}:{{SERVERPORT}}/default01.static.socialpointgames.com/static/socialempires/flash/{{GAMEVERSION}}",
                    backgroundColor: "#669C2C",
                    allowScriptAccess: false,
                    autoplay: true,
                    backgroundExecutionMode: "mainThread",
                    parameters: '\
                        spdebug=notnull&brk=0\
                        &staticUrl=http://{{SERVERIP}}:{{SERVERPORT}}/default01.static.socialpointgames.com/static/socialempires/&brk=0\
                        &dynamicUrl=http://{{SERVERIP}}:{{SERVERPORT}}/dynamic.flash1.dev.socialpoint.es/appsfb/socialempiresdev/srvempires/&brk=0\
                        &skiphash12341=notnull&brk=0\
                        &fb_sig_user={{save_info.userid}}&brk=0\
                        &user_key=123456789&brk=0\
                        &language=en&brk=0\
                        &accessToken=AAABbZAm0wdMUBALsOrR0Ho68CLjaOT8SV3vftKg9mbo1zZColaW5FljRVaLxPGxXXnm1M98mTZCAttcQ4GHwvSyXfsyxYmvKMH8Hmn5iliSPnjvIsZA6&brk=0\
                        &sex=m&brk=0\
                        &lastLoggedIn=1349266517&brk=0\
                        &dailyBonus=0&brk=0\
                        &friendsInfo[{"first_name":"AcidCaos","uid":"100000","pic_square":"http://{{SERVERIP}}:{{SERVERPORT}}/img/profile/x.jpg"}}]&brk=0\
                        &serverTime={{serverTime}}&brk=0\
                        &forceSyncError=1&brk=0\
                        &forceAttackReload=0&brk=0\
                        &forceQuestReload=0&brk=0'
                }).then(function () {
                    ruffleStatus("Ruffle " + ruffleVersion + " running {{GAMEVERSION}}.");
                }).catch(function (error) {
                    ruffleStatus("Ruffle could not load the game (SWF missing or blocked): " + error, true);
                });
            </script>
        </object>
{% endblock %}
